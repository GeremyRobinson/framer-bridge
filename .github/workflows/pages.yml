name: Publish the dashboard

# Serves this repository (the Framer Bridge app) on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site && cp -r index.html app.js style.css template _site/
          # Version the script and stylesheet so browsers never mix an old
          # copy of one with a new copy of the page.
          v=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/app\.js\"/app.js?v=$v\"/; s/style\.css\"/style.css?v=$v\"/" _site/index.html
          grep -o '[a-z]*\.[a-z]*?v=[0-9a-f]*' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
