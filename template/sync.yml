name: Sync site

# Keeps this repository's copy of the website named in .site.json up to date
# and serves it on GitHub Pages.
#
# Every 15 minutes it checks whether the website was republished, and if so
# re-exports it with tools/export.mjs and deploys the result. It also runs on
# every push to main and from the Actions tab ("Run workflow").
# GitHub's timer is best effort and can skip runs, so Bridge's "Check now"
# starts the same check on demand (force: false).
on:
  push:
    branches: [main]
  schedule:
    # Off the top of the hour, when GitHub drops the most scheduled runs.
    - cron: "4-59/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-export even if the site hasn't changed
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) || steps.seen.outputs.cache-hit != 'true' }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
      site_url: ${{ steps.fp.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .site.json
          sparse-checkout-cone-mode: false
      - name: Fingerprint the published site
        id: fp
        run: |
          url=$(jq -r '.source' .site.json)
          url=${url%/}
          echo "site_url=$url" >> "$GITHUB_OUTPUT"
          # Every publish gives the site new hashed script and asset names, so
          # the set of URLs on the homepage plus the sitemap changes on publish.
          html=$(curl -fsSL "$url/")
          sitemap=$(curl -fsSL "$url/sitemap.xml" || true)
          fp=$( { echo "$html" | grep -oE 'https://[^"'"'"' )<>]+' | sort -u; echo "$sitemap"; } | sha256sum | cut -c1-16)
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "Site $url fingerprint: $fp"
      - name: Check whether this version is already published
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .site-fingerprint
          key: site-${{ steps.fp.outputs.fingerprint }}
          lookup-only: true

  build:
    name: Export
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set when Bridge has stored the design project's link and API key.
      HAS_PROJECT: ${{ secrets.SITE_PROJECT != '' && secrets.SITE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the site
        run: |
          # On a custom domain or a <user>.github.io repo the site is served
          # from the domain root; otherwise from /<repo>/.
          repo="${{ github.event.repository.name }}"
          domain=$(jq -r '.domain // empty' .site.json)
          base="/$repo/"
          if [ -n "$domain" ]; then base="/"; fi
          case "$repo" in *.github.io) base="/" ;; esac
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
          node tools/export.mjs "${{ needs.check.outputs.site_url }}" --base-path "$base" --out _site
      - name: Check the export before publishing
        run: |
          cat _site/export-report.json
          # Don't replace a working site with a broken export.
          node -e '
            const r = require("./_site/export-report.json");
            const pageFailures = r.failures.filter((f) => f.includes("(page"));
            if (!r.pages.includes("index.html")) throw new Error("homepage missing from export");
            if (pageFailures.length) throw new Error("pages failed: " + pageFailures.join(", "));
            console.log(`OK: ${r.pages.length} pages, ${r.files} files`);
          '
      - name: Save the design project
        # Pages, layers, CMS, code files, styles and images, as plain files.
        # A problem here never blocks the site: the last saved copy stays.
        if: env.HAS_PROJECT == 'true'
        continue-on-error: true
        env:
          SITE_PROJECT: ${{ secrets.SITE_PROJECT }}
          SITE_API_KEY: ${{ secrets.SITE_API_KEY }}
        run: node tools/project.mjs --out _project
      - name: Rebuild the site as a React app
        # Writes app/, a React + Vite project of every page with no builder
        # code in it (the site's own code components run live in it), and serves its build at <site>/react/ as a preview.
        # A problem here never blocks the site.
        if: hashFiles('tools/react.mjs') != ''
        continue-on-error: true
        run: |
          # The site's own code components come from the saved design project.
          proj=project; if [ -f _project/project.json ]; then proj=_project; fi
          node tools/react.mjs --site _site --out _app --project "$proj" --base "${SITE_BASE}react/"
          cd _app
          npm install --no-audit --no-fund --loglevel=error
          npm run build
          cp -r dist ../_site/react
      - name: Commit the exported files to site/, project/ and app/
        # Keeps the full site (HTML, CSS, JS, images, CMS data) and, when
        # connected, the design project in this repo, one commit per publish. Turn off with "commitSite": false in
        # .site.json. Pushes made with the workflow token don't start
        # another run, so this can't loop.
        run: |
          if [ "$(jq -r '.commitSite // true' .site.json)" != "true" ]; then exit 0; fi
          rm -rf site && mkdir site
          # GitHub refuses files over 100 MB; those stay on Pages only.
          rsync -a --max-size=95m --exclude=/react/ _site/ site/
          big=$(cd _site && find . -type f -size +95M)
          if [ -n "$big" ]; then echo "::warning::Too large to commit, kept on Pages only: $big"; fi
          git add -A site
          if [ -f _project/project.json ]; then
            rm -rf project && mv _project project && git add -A project
          fi
          if [ -f _app/src/App.jsx ]; then
            rm -rf _app/node_modules _app/dist app && mv _app app && git add -A app
          fi
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          published=$(jq -r '.publish.published // empty' site/export-report.json)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update site${published:+ (published $published)}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 3; done
          echo "::warning::Couldn't push site/ to main; the site is still deployed"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Remember this version as published
        run: echo "${{ needs.check.outputs.fingerprint }}" > .site-fingerprint
      - uses: actions/cache/save@v4
        with:
          path: .site-fingerprint
          key: site-${{ needs.check.outputs.fingerprint }}
